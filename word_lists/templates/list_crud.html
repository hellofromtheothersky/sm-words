<!-- Modal -->
<script>
    function list_crud(action){
        if(action=='c') //from button in the model screen
        {
            list_new_name=$('#addOrEditlistmodel input#listname').val()
            if(list_new_name!='')
                $.ajax({
                    url: "/ajax_crud_list/",
                    type: 'get',
                    contentType: 'appication/json',
                    data: {
                        'listname': list_new_name,
                        'action': 'c',
                    },
                    success: function(response){
                        $('#list_word_group').load(document.URL +  ' #list_word_group');
                        $('#addOrEditlistmodel').modal('hide');

                        $('#add_edit_word_model select#list_choose').load(document.URL +  ' #add_edit_word_model select#list_choose>*');
                    }
                })
        }
        else if(action=='d') //from button in the main screen
        {
            list_id=list.attr('id')
            $.ajax({
                    url: "/ajax_crud_list/",
                    type: 'get',
                    contentType: 'appication/json',
                    data: {
                        'list_id': list_id,
                        'action': 'd'
                    },
                    success: function(response){
                        $('#list_word_group').load(document.URL +  ' #list_word_group');
                        $('#deletelistmodel').modal('hide');

                        $('#add_edit_word_model select#list_choose').load(document.URL +  ' #add_edit_word_model select#list_choose>*');
                        $('#sentence_group').load(document.URL +  ' #sentence_group', function(){ renumber_words(); });
                    }
                })
        }
        else if(action=='u') //from button in the model screen
        {
            list_id=list.attr('id')
            list_new_name=$('#addOrEditlistmodel input#listname').val()
            $.ajax({
                    url: "/ajax_crud_list/",
                    type: 'get',
                    contentType: 'appication/json',
                    data: {
                        'list_id': list_id,
                        'listname': list_new_name,
                        'action': 'u'
                    },
                    success: function(response){
                        $('#list_word_group').load(document.URL +  ' #list_word_group');
                        $('#addOrEditlistmodel').modal('hide');

                        $('#add_edit_word_model select#list_choose').load(document.URL +  ' #add_edit_word_model select#list_choose>*');
                    }
                })
        }
    }
    $(document).on('click', '.add_list', function(){
        $('#addOrEditlistmodel .modal-title').text('Add list')

        $('#addOrEditlistmodel .btn').text('Add')
        $('#addOrEditlistmodel .btn').off("click")
        $('#addOrEditlistmodel .btn').click(function() {
                list_crud('c');
            });
    });
    $(document).on('click', '.edit_list', function(){
        $('#addOrEditlistmodel .modal-title').text('Edit list')

        $('#addOrEditlistmodel .btn').text('Save')
        $('#addOrEditlistmodel .btn').off("click")
        $('#addOrEditlistmodel .btn').click(function() {
                list_crud('u');
            });

        list=$(this).parentsUntil("div").siblings().first()
        $('#addOrEditlistmodel input#listname').val(list.data('listname'))
    });
    $(document).on('click', '.delete_list', function(){
        list=$(this).parentsUntil("div").siblings().first()
        $('#deletelistmodel .deleted_list_name').text(list.data('listname'))
    });
</script>
<div class="modal fade" id="addOrEditlistmodel" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel">Add/Edit</h5>
            <button type="button" class="btn-close"  data-bs-dismiss="modal" aria-label="Close">
            </button>
        </div>
        <div class="modal-body">
            <input id="listname" class="form-control" type="text" placeholder="List name">
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-warning">Add/Save</button>
        </div>
        </div>
    </div>
</div>
<div class="modal fade" id="deletelistmodel" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
        <div class="modal-header">
            <h5 class="modal-title" id="exampleModalLabel">Delete list</h5>
            <button type="button" class="btn-close"  data-bs-dismiss="modal" aria-label="Close">
            </button>
        </div>
        <div class="modal-body">
            <p>Deleting a list will also delete its words</p>
            <p>Delete <strong class="deleted_list_name"></strong></p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-danger" onclick="list_crud('d');">Delete</button>
        </div>
        </div>
    </div>
</div>
